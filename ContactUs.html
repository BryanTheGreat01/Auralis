<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auralis</title>
    <link rel="stylesheet" href="bootstrap-reboot.min.css">
    <link rel="stylesheet" href="bootstrap-grid.min.css">
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="css/carousel.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header data-bs-theme="dark">
        <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
            <div class="container-fluid">
                <div class="mb-2 mb-md-0">
                    <a href="index.html" class="text-decoration-none align-items-center d-flex">
                        <img src="logo.png" alt="Auralis Logo" class="logo bi me-2" width="35" height="35">
                        <span class="fs-5"> Auralis </span>
                    </a>
                </div> <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false"
                    aria-label="Toggle navigation"> <span class="navbar-toggler-icon"></span> </button>
                <div class="navbar-collapse collapse" id="navbarCollapse" style="">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0 ms-3">
                        <li class="nav-item"> <a class="nav-link" aria-current="page" href="index.html">Home</a> </li>
                        <li class="nav-item"> <a class="nav-link" href="AboutUs.html">About Us</a> </li>
                        <li class="nav-item"> <a class="nav-link active" href="#">Contact Us</a> </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container marketing py-5">
            <div class="row">
                <div class="col-lg-6 text-start">
                    <h2 class="fw-normal fs-1">Contact Us</h2></br>
                    <p class="fs-5">Feel free to use the form or drop us an email. Old-fashioned phone calls work too.
                    </p>

                    <div class="container text-center">
                        <div class="row row-cols-auto">
                            <div class="col">
                                <img src="Images/phone.png" alt="Phone logo" class="logo bi" width="25" height="25"> :
                            </div>
                            <div class="col">
                                <div class="fs-6">484-324-2400</div>
                            </div>
                        </div>
                    </div></br>

                    <div class="container text-center">
                        <div class="row row-cols-auto">
                            <div class="col">
                                <img src="Images/Email1.png" alt="Email logo" class="logo bi" width="25" height="25"> :
                            </div>
                            <div class="col">
                                <div class="fs-6">info@auralis.com</div>
                            </div>
                        </div>
                    </div></br>

                    <div class="container text-center">
                        <div class="row row-cols-auto">
                            <div class="col">
                                <img src="Images/Map.png" alt="Address logo" class="logo bi" width="25" height="25"> :
                            </div>
                            <div class="col">
                                <div class="fs-6">123 Main Street, Anytown, USA</div>
                            </div>
                        </div>
                    </div>
                </div><!-- /.col-lg-6 -->





                <!-- text field -->
                <div class="col-lg-6 text-start">
                    </br>
                    <div class="container text-start">
                        <div class="row">
                            <label for="name" class="col">
                                Name
                            </label>
                        </div>
                        <div class="input-group">
                            <input type="text" class="form-control" id="name" aria-label="First name"
                                placeholder="first-name">
                            <input type="text" class="form-control" id="lname" aria-label="Last name"
                                placeholder="last-name">
                        </div>
                    </div>
                    </br>



                    <div class="container text-start">
                        <div class="row">
                            <label for="email" class="col">
                                Email
                            </label>
                        </div>
                        <div class="input-group flex-nowrap">
                            <input type="email" class="form-control" id="email" placeholder="example@email.com"
                                aria-label="Email" aria-describedby="addon-wrapping">
                        </div>
                    </div>
                    </br>

                    <div class="container text-start">
                        <div class="row">
                            <label for="phone" class="col">
                                Phone(optional)
                            </label>
                        </div>
                        <div class="input-group flex-nowrap">
                            <input type="text" class="form-control" id="phone" placeholder="xxx-xxx-xxxx"
                                aria-label="Phone" aria-describedby="addon-wrapping">
                        </div>
                    </div>
                    </br>


                    <div class="container text-start">
                        <div class="row">
                            <label for="message" class="col">
                                Message
                            </label>
                        </div>
                        <div class="input-group flex-nowrap">
                            <textarea class="form-control" id="message" style="height: 100px"
                                placeholder="Type your message" aria-label="Message"
                                aria-describedby="addon-wrapping"></textarea>
                        </div>
                    </div>
                    </br>

                    <div class="container text-center">
                        <div class="row">
                            <div class="col">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </div>
                    </div>

                </div>

                <footer class="container">
                    <p>© 2017–2025 Company, Inc. · <a href="#">Privacy</a> · <a href="#">Terms</a></p>
                </footer>
    </main>

    <script src="js/bootstrap.bundle.min.js" class="astro-vvvwv3sm"></script>
</body>

</html>
